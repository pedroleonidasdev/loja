# Servidor
server.port=${PORT:8080}

# Datasource MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pdv_generico?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari - limite de conexoes (Clever Cloud plano free permite max 5 conexoes)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:troque-esta-chave-secreta-em-producao-para-algo-bem-mais-longo-e-aleatorio-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Usuários iniciais (seed) - IMPORTANTE: defina essas variáveis em produção
# em vez de usar os valores padrão (admin123 / caixa123), que estão neste
# arquivo de código-fonte e por isso são públicos.
app.seed.admin-senha=${ADMIN_SENHA_INICIAL:admin123}
app.seed.caixa-senha=${CAIXA_SENHA_INICIAL:caixa123}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:https://presentededeus.vercel.app,http://localhost:3000}

# Notificacoes push (Web Push / VAPID). Sem as chaves, o envio fica desativado.
app.vapid.public-key=${VAPID_PUBLIC_KEY:}
app.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.vapid.subject=${VAPID_SUBJECT:mailto:contato@lojapresentededeus.com.br}

# Upload de fotos (leitura do relatório de consignação)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB

# Leitura de fotos do relatório por IA (Anthropic). Sem a chave, o recurso fica desativado.
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}

# Anexos do chat de suporte (ficam no banco e expiram em 7 dias).
# Tamanho maximo por arquivo, em MB (nao passe de spring.servlet.multipart.max-file-size, hoje 6MB).
app.suporte.anexos.max-mb=${ANEXOS_MAX_MB:5}
# Limite de espaco total ocupado por anexos, em MB. Reduza se o banco for pequeno.
app.suporte.anexos.max-total-mb=${ANEXOS_MAX_TOTAL_MB:100}
